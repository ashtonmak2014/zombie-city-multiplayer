<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三维打僵尸</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: "Microsoft YaHei", sans-serif; color: #fff; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 12px; font-size: 16px; line-height: 1.6;
    text-shadow: 0 0 4px #000; pointer-events: none; }
  #bhud { position: fixed; left: 12px; bottom: 12px; font-size: 17px;
    text-shadow: 0 0 4px #000; pointer-events: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 12px; height: 12px;
    margin: -6px 0 0 -6px; pointer-events: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; }
  #cross::before { left: 5px; top: 0; width: 2px; height: 12px; }
  #cross::after { top: 5px; left: 0; height: 2px; width: 12px; }
  #flash { position: fixed; inset: 0; background: rgba(255,0,0,0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; box-sizing: border-box; }
  #overlay h1 { font-size: 36px; margin: 0 0 10px; }
  #overlay p { font-size: 15px; line-height: 1.8; opacity: 0.9; margin: 0 0 20px; }
  #start { font-size: 20px; padding: 12px 40px; border: none; border-radius: 8px;
    background: #e53935; color: #fff; cursor: pointer; font-family: inherit; }
  #loadout { position: fixed; inset: 0; z-index: 5; display:none; align-items:center; justify-content:center; background:rgba(5,10,12,.88); }
  #loadoutPanel { width:min(820px,92vw); padding:24px; border:1px solid #45d9e8; background:linear-gradient(135deg,#162326,#080d10); box-shadow:0 0 35px #00c8df55; }
  #loadoutPanel h2 { color:#6cecf2; margin:0 0 14px; }
  #loadoutItems { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; }
  #loadoutItems button { padding:12px; color:#e4eeee; background:#26353a; border:1px solid #52686d; cursor:pointer; font:inherit; }
  #loadoutItems button:hover { background:#23606a; }
  #buildMenu { position:fixed; inset:0; z-index:6; display:none; align-items:center; justify-content:center; background:rgba(5,10,12,.88); }
  #buildPanel { width:min(760px,92vw); padding:24px; border:1px solid #9fbd86; background:linear-gradient(135deg,#20291f,#0b100c); box-shadow:0 0 35px #8cc65a44; }
  #buildPanel h2 { color:#b9e48c; margin:0 0 8px; }
  #buildItems { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; margin-top:14px; }
  #buildItems button { padding:12px; color:#e9f0e3; background:#303b2d; border:1px solid #697e5c; cursor:pointer; font:inherit; }
  #buildItems button:hover { background:#526d3e; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="bhud"></div>
<div id="cross"></div>
<div id="flash"></div>
<div id="overlay">
  <h1 id="title">三维打僵尸</h1>
  <p id="desc"></p>
  <button id="start">开始</button>
</div>
<div id="loadout"><div id="loadoutPanel"><h2>战斗装备 · 按 F 关闭</h2><div id="loadoutItems"></div></div></div>
<div id="buildMenu"><div id="buildPanel"><h2>基地建造 · 按 B 或 Esc 关闭</h2><div>选择后会在你面前放置；需要先搜刮足够材料。</div><div id="buildBalance" style="margin-top:10px;color:#d6efbd"></div><div id="buildItems"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= 基础 =================
const $ = id => document.getElementById(id);
const hudEl = $("hud"), bhudEl = $("bhud"), flashEl = $("flash");
const overlay = $("overlay"), titleEl = $("title"), descEl = $("desc"), startBtn = $("start");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x858b86);
scene.fog = new THREE.Fog(0x858b86, 35, 115);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 200);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 0.9));
const sun = new THREE.DirectionalLight(0xc7c5ad, 0.62);
sun.position.set(30, 50, 20);
scene.add(sun);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= 贴图 =================
function canvasTex(draw) {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const groundTex = canvasTex(g => {
  g.fillStyle = "#6e6a52"; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 300; i++) {
    g.fillStyle = Math.random() < 0.5 ? "rgba(0,60,0,0.12)" : "rgba(120,160,60,0.12)";
    g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
  }
});
groundTex.repeat.set(65, 65);
const wallTex = canvasTex(g => {
  g.fillStyle = "#827d70"; g.fillRect(0, 0, 128, 128);
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
    const x = 8 + c * 64, y = 12 + r * 58;
    g.fillStyle = "#242d31"; g.fillRect(x, y, 46, 34);
    g.strokeStyle = "#a69d88"; g.lineWidth = 3; g.strokeRect(x, y, 46, 34);
    g.fillStyle = "#4d514d"; g.fillRect(x + 4, y + 4, 38, 26);
    g.fillStyle = "rgba(20,22,20,.65)"; g.fillRect(x + 20, y + 4, 2, 26);
  }
  g.fillStyle = "rgba(35,32,27,.3)";
  for (let i = 0; i < 90; i++) g.fillRect(Math.random()*128, Math.random()*128, 2+Math.random()*7, 1+Math.random()*3);
  g.strokeStyle = "#373833"; g.lineWidth = 2;
  for (const x of [29, 91]) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x-5, 25); g.lineTo(x+3, 46); g.lineTo(x-3, 70); g.lineTo(x+4, 96); g.lineTo(x, 128); g.stroke(); }
});
function wallMat(w, h) {
  const t = wallTex.clone();
  t.needsUpdate = true;
  t.repeat.set(Math.max(1, w / 4), Math.max(1, h / 4));
  return new THREE.MeshLambertMaterial({ map: t });
}

// ================= 地面 =================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshLambertMaterial({ map: groundTex }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ================= 碰撞体（墙 AABB）与站立面 =================
const walls = [];
function addBox(x0, x1, y0, y1, z0, z1, color) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const mat = color === "wall" ? wallMat(w, h) : new THREE.MeshLambertMaterial({ color });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  scene.add(m);
  if (color === "wall") walls.push({ x0, x1, y0, y1, z0, z1 });
}

// 公寓：x 在 -7.5~7.5，z 在 -5.5~5.5，两层，高 8.5
addBox(-7.5, 7.5, 0, 8.5, -5.5, -5, "wall"); // 北墙
addBox(-7.5, -7, 0, 8.5, -5, 5, "wall");     // 西墙
addBox(7, 7.5, 0, 8.5, -5, 5, "wall");       // 东墙
addBox(-7.5, -1, 0, 8.5, 5, 5.5, "wall");    // 南墙（左）
addBox(1, 7.5, 0, 8.5, 5, 5.5, "wall");      // 南墙（右）
addBox(-1, 1, 6.5, 8.5, 5, 5.5, "wall");     // 门楣
addBox(-2, 7, 3.8, 4, -5, 5, "#8d7b65");     // 二楼地板
addBox(6, 7, 7.8, 8, -5, 5, "#8d7b65");      // 天台地板

// 站立面：平地（flat）和斜坡楼梯（ramp）
const surfaces = [
  { t: "flat", x0: -130, x1: 130, z0: -130, z1: 130, y: 0 },
  { t: "flat", x0: -2, x1: 7, z0: -5, z1: 5, y: 4 },
  { t: "flat", x0: 6, x1: 7, z0: -5, z1: 5, y: 8 },
  { t: "ramp", x0: -6, x1: -2, z0: -4, z1: 4, ya: 0, yb: 4 },
  { t: "ramp", x0: 2, x1: 6, z0: -4, z1: 4, ya: 4, yb: 8 },
];
function rampMesh(x0, x1, ya, yb, z0, z1) {
  const len = Math.hypot(x1 - x0, yb - ya);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.3, z1 - z0), new THREE.MeshLambertMaterial({ color: 0x8d7b65 }));
  m.rotation.z = Math.atan2(yb - ya, x1 - x0);
  m.position.set((x0 + x1) / 2, (ya + yb) / 2 - 0.15, (z0 + z1) / 2);
  scene.add(m);
}
rampMesh(-6, -2, 0, 4, -4, 4);
rampMesh(2, 6, 4, 8, -4, 4);

function surfaceY(s, x) {
  if (s.t === "flat") return s.y;
  return s.ya + (s.yb - s.ya) * (x - s.x0) / (s.x1 - s.x0);
}
// 在 (x,z) 处、接近 ref 高度的最高站立面
function groundAt(x, z, ref) {
  let best = -Infinity;
  for (const s of surfaces) {
    if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
    const y = surfaceY(s, x);
    if (y <= ref + 0.6 && y > best) best = y;
  }
  return best === -Infinity ? 0 : best;
}
const PR = 0.35;
function hitsWall(x, z, feet) {
  for (const w of walls) {
    if (feet + 1.7 < w.y0 || feet > w.y1) continue;
    if (x + PR > w.x0 && x - PR < w.x1 && z + PR > w.z0 && z - PR < w.z1) return true;
  }
  return false;
}
function inWallPoint(x, y, z) {
  for (const w of walls) {
    if (x > w.x0 && x < w.x1 && y > w.y0 && y < w.y1 && z > w.z0 && z < w.z1) return true;
  }
  return false;
}
function inBuilding(x, z) { return x > -8 && x < 8 && z > -6 && z < 6; }

// 射线与 AABB 相交，返回进入距离
function rayBox(o, d, b) {
  let tmin = -Infinity, tmax = Infinity;
  const mins = [b.x0, b.y0, b.z0], maxs = [b.x1, b.y1, b.z1];
  const os = [o.x, o.y, o.z], ds = [d.x, d.y, d.z];
  for (let i = 0; i < 3; i++) {
    if (Math.abs(ds[i]) < 1e-9) {
      if (os[i] < mins[i] || os[i] > maxs[i]) return Infinity;
    } else {
      let t1 = (mins[i] - os[i]) / ds[i], t2 = (maxs[i] - os[i]) / ds[i];
      if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
      tmin = Math.max(tmin, t1);
      tmax = Math.min(tmax, t2);
      if (tmin > tmax) return Infinity;
    }
  }
  return tmin > 0 ? tmin : (tmax > 0 ? 0 : Infinity);
}

// ================= 炮台 =================
const turrets = [];
function makeTurret(x, y, z, type) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 1), new THREE.MeshLambertMaterial({ color: 0x37474f }));
  base.position.y = 0.3;
  g.add(base);
  const len = type === "C" ? 1.8 : 1.2, r = type === "C" ? 0.22 : 0.09;
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10),
    new THREE.MeshLambertMaterial({ color: type === "C" ? 0xff5722 : 0x9e9e9e }));
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.9, -len / 2 + 0.2);
  g.add(barrel);
  g.position.set(x, y, z);
  scene.add(g);
  const t = { x, y, z, type, mesh: g };
  turrets.push(t);
  return t;
}
makeRealTurret(-0.5, 4, -3, "T"); // 二楼机枪
makeRealTurret(6.5, 8, -3, "C");  // 天台大炮

// ================= 森林、废弃汽车、坦克 =================
const tank = { x: -16, y: 0, z: 10, yaw: 0, mesh: null };

// ================= 音效（合成）、战斗机、末世地表 =================
let actx = null, engine = null;
function initSound() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(f, dur, type, vol, slideTo) {
  if (!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource();
  s.buffer = buf;
  const g = actx.createGain();
  g.gain.value = vol;
  s.connect(g).connect(actx.destination);
  s.start();
}
function sfxBoom() { noiseBurst(0.5, 0.55); tone(88, 0.58, "sine", 0.52, 24); tone(43, 0.5, "triangle", 0.32, 22); }
function sfxShot() { noiseBurst(0.11, 0.36); tone(210, 0.12, "square", 0.18, 52); }
function sfxRifle() { noiseBurst(0.12, 0.42); tone(145, 0.13, "sawtooth", 0.2, 38); tone(620, 0.025, "square", 0.08, 180); }
function sfxCannon() { noiseBurst(0.48, 0.62); tone(64, 0.58, "sawtooth", 0.38, 19); tone(36, 0.5, "sine", 0.35, 20); }
function sfxMachineGun() { noiseBurst(0.09, 0.3); tone(185, 0.09, "square", 0.16, 48); }
function sfxSaw() { tone(95, 0.16, "sawtooth", 0.08, 65); }
function sfxFlame() { noiseBurst(0.07, 0.08); tone(75, 0.1, "sawtooth", 0.035, 45); }
function sfxBomb() { tone(90, 0.5, "sine", 0.34, 24); noiseBurst(0.42, 0.32); }
function useMedkit() { if (P.medkits <= 0 || P.hp >= 100) return; P.medkits--; P.hp = Math.min(100, P.hp + 45); P.regenWait = 0; tone(660,0.18,"sine",0.12,880); }
function sfxTankEngine() { if (!actx) return; tone(52 + Math.random()*12, 0.22, "sawtooth", 0.035, 38); }
// 引擎持续声：坦克低沉，飞机尖锐
function engineStart(kind) {
  if (!actx || engine) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = kind === "plane" ? "sawtooth" : "square";
  o.frequency.value = kind === "plane" ? 140 : 55;
  g.gain.value = 0.04;
  o.connect(g).connect(actx.destination);
  o.start();
  engine = { o, g, kind };
}
function engineUpdate(level) {
  if (!engine || !actx) return;
  if (engine.kind === "tank" && level > 0.5 && Math.random() < 0.1) sfxTankEngine();
  const base = engine.kind === "plane" ? 140 : 55;
  const range = engine.kind === "plane" ? 300 : 90;
  engine.o.frequency.setTargetAtTime(base + level * range, actx.currentTime, 0.1);
  engine.g.gain.setTargetAtTime(0.03 + level * 0.05, actx.currentTime, 0.1);
}
function engineStop() {
  if (engine) {
    try { engine.o.stop(); } catch (e) {}
    engine = null;
  }
}

// 战斗机：W/S 油门，鼠标控制机头，空格上升、Ctrl 下降，左键机炮，Q 导弹，G 下机
const PLANE_HOME = { x: 10, y: 0, z: -10, yaw: 0 };
const plane = { ...PLANE_HOME, speed: 0, mesh: null, mcd: 0, bombCd: 0, fp: false, beacon: null, destroyed: false, respawnTimer: 0 };
function buildPlane() {
  const g = new THREE.Group();
  const grey = new THREE.MeshLambertMaterial({ color: 0x6b7480 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2a2f36 });
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 9, 12), grey);
  fus.rotation.x = Math.PI / 2;
  fus.position.set(0, 1.2, 0);
  g.add(fus);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 8), grey);
  nose.position.set(0, 1.2, -4.5);
  g.add(nose);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(12, 0.15, 2.6), grey);
  wing.position.set(0, 1.2, 0);
  g.add(wing);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.4, 2), grey);
  tail.position.set(0, 2.2, 4);
  g.add(tail);
  const hstab = new THREE.Mesh(new THREE.BoxGeometry(5, 0.12, 1.4), grey);
  hstab.position.set(0, 1.5, 4);
  g.add(hstab);
  for (const sx of [-4.2, 4.2]) {
    const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.2, 8), dark);
    pod.rotation.x = Math.PI / 2;
    pod.position.set(sx, 0.7, -0.5);
    g.add(pod);
  }
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.6, 10, 8), new THREE.MeshLambertMaterial({ color: 0x3a6a9a, transparent: true, opacity: 0.7 }));
  canopy.position.set(0, 1.9, -1);
  canopy.scale.set(1, 0.8, 1.6);
  g.add(canopy);
  scene.add(g);
  plane.mesh = g;
  g.position.set(plane.x, plane.y, plane.z);
  const marker = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.12, 8, 28), new THREE.MeshBasicMaterial({ color: 0xffc247 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.12; marker.add(ring);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.45, 5, 10, 1, true), new THREE.MeshBasicMaterial({ color: 0xffc247, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
  beam.position.y = 2.7; marker.add(beam); marker.position.set(plane.x, 0, plane.z); scene.add(marker); plane.beacon = marker;
}
function nearPlane() {
  return !plane.destroyed && !P.flying && Math.hypot(plane.x - P.x, plane.z - P.z) < 12 && P.y < 4;
}
function resetPlane() {
  Object.assign(plane, PLANE_HOME, { speed: 0, mcd: 0, bombCd: 0, fp: false, destroyed: false, respawnTimer: 0 });
  if (plane.mesh) {
    plane.mesh.position.set(plane.x, plane.y, plane.z);
    plane.mesh.rotation.set(0, plane.yaw, 0);
    plane.mesh.visible = true;
  }
  if (plane.beacon) plane.beacon.visible = true;
}
function enterPlane() {
  if (plane.destroyed) return;
  if (!plane.mesh) buildPlane();
  if (P.flying) return;
  P.armorActive=false; P.armor=false; P.vehicle=null; P.turret=null;
  if (plane.beacon) plane.beacon.visible=false;
  if (plane.mesh) plane.mesh.visible=false;
  P.flying = true;
  engineStop();
  P.vehicle = null;
  P.turret = null;
  P.yaw = plane.yaw;
  P.pitch = 0;
  plane.fp = false;
  P.x = plane.x; P.z = plane.z; P.y = plane.y;
  initSound(); engineStart("plane");
}
function exitPlane() {
  P.flying = false;
  if (plane.mesh) plane.mesh.visible=true;
  if (plane.beacon) plane.beacon.visible=true;
  plane.fp = false;
  plane.speed = 0;
  engineStop();
  plane.yaw = P.yaw;
  P.x = plane.x + 6;
  P.z = plane.z;
  plane.y = groundAt(plane.x, plane.z, 0);
  P.y = groundAt(P.x, P.z, plane.y);
}
function crash() {
  explode(plane.x, plane.y, plane.z);
  exitPlane();
  plane.destroyed = true;
  plane.respawnTimer = 8;
  if (plane.mesh) plane.mesh.visible = false;
  if (plane.beacon) plane.beacon.visible = false;
  damage(60);
}
function planeMissile() {
  if (plane.mcd > 0) return;
  plane.mcd = 1.2;
  const forward = dirVec(P.yaw, 0);
  // Release a guided missile from beneath the aircraft, independent of the aiming reticle.
  launchRocket({ x: plane.x, y: plane.y - 1.25, z: plane.z },
    { x: forward.x * 0.62, y: -0.78, z: forward.z * 0.62 }, { homing: true });
  sfxCannon();
}
function planeBomb() {
  if (plane.bombCd > 0) return;
  plane.bombCd = 1.1;
  const d = dirVec(P.yaw, P.pitch);
  const o = { x: plane.x + d.x * 1.8, y: plane.y - 0.8, z: plane.z + d.z * 1.8 };
  muzzleSpark(o,d,0xffbd52,5);
  projectiles.push({ x: o.x, y: o.y, z: o.z, vx: d.x * Math.max(12, plane.speed * 0.65), vy: -2, vz: d.z * Math.max(12, plane.speed * 0.65), life: 3.2, dead: false, mesh: (() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshLambertMaterial({ color: 0x29302b })); scene.add(m); return m; })() });
  sfxBomb();
}
function planeFly(dt) {
  const pl = plane;
  pl.yaw = P.yaw;
  pl.mcd = Math.max(0, pl.mcd - dt);
  pl.bombCd = Math.max(0, pl.bombCd - dt);
  if (keys.KeyW) pl.speed = Math.min(60, pl.speed + 18 * dt);
  if (keys.KeyS) pl.speed = Math.max(0, pl.speed - 22 * dt);
  const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const fx = -Math.sin(P.yaw) * cp, fz = -Math.cos(P.yaw) * cp;
  pl.x = Math.max(-125, Math.min(125, pl.x + fx * pl.speed * dt));
  pl.z = Math.max(-125, Math.min(125, pl.z + fz * pl.speed * dt));
  let vy = sp * pl.speed;
  // Give the aircraft strong vertical thrust so it can take off immediately without a runway.
  if (keys.Space) vy += 26;
  if (keys.ControlLeft) vy -= 18;
  if (pl.speed < 30) vy -= (30 - pl.speed) * 0.5;
  pl.y += vy * dt;
  pl.y = Math.min(pl.y, 200);
  if (inWallPoint(pl.x, pl.y, pl.z)) { crash(); return; }
  const gy = groundAt(pl.x, pl.z, pl.y);
  if (pl.y <= gy + 0.8) {
    // Slow or stationary aircraft should settle on the runway, not crash on the first frame after boarding.
    if (pl.speed > 30 && vy < -12) { crash(); return; }
    pl.y = gy + 0.8;
    pl.speed = Math.max(0, pl.speed - 30 * dt);
  }
  P.x = pl.x; P.z = pl.z; P.y = pl.y;
  if (mouseDown) {
    if (P.fireCd <= 0) {
      P.fireCd = 0.1;
      shootRay(eyePos(), dirVec(P.yaw, P.pitch), 1);
      sfxMachineGun();
    }
  }
  if (pl.mesh) {
    pl.mesh.position.set(pl.x, pl.y, pl.z);
    pl.mesh.rotation.set(-P.pitch * 0.5, pl.yaw, 0);
  }
}

function destroyDestructible(d) {
  if (d.dead) return;
  d.dead = true;
  scene.remove(d.mesh);
  const i = walls.indexOf(d.box);
  if (i >= 0) walls.splice(i, 1);

// 火箭弹爆炸时，附近的树和车会受损
function damageDestructibles(x, y, z, r, amt) {
  for (const d of destructibles) {
    if (d.dead) continue;
    const cx = (d.box.x0 + d.box.x1) / 2, cz = (d.box.z0 + d.box.z1) / 2;
    const half = Math.max(d.box.x1 - d.box.x0, d.box.z1 - d.box.z0) / 2;
    if (Math.hypot(cx - x, cz - z) < r + half) {
      d.hp -= amt;
      if (d.hp <= 0) destroyDestructible(d);
    }
  }
  for (let i = destructibles.length - 1; i >= 0; i--) {
    if (destructibles[i].dead) destructibles.splice(i, 1);
  }
}

let buildOpen = false;
const buildMenuEl = $("buildMenu"), buildItemsEl = $("buildItems"), buildBalanceEl = $("buildBalance");
const buildCosts = {
  "机枪炮台": { wood: 2, iron: 8, aluminum: 5 },
  "铁门": { wood: 0, iron: 5, aluminum: 3 },
  "铁墙": { wood: 0, iron: 3, aluminum: 2 },
  "床": { wood: 3, iron: 1, aluminum: 0 }
};
const builtColliders = [];
function buildCostText(cost) {
  return `木材 ${cost.wood} · 铁 ${cost.iron} · 铝 ${cost.aluminum}`;
}
function hasBuildMaterials(cost) {
  return resources.wood >= cost.wood && resources.iron >= cost.iron && resources.aluminum >= cost.aluminum;
}
function refreshBuildBalance() {
  buildBalanceEl.textContent = `拥有：木材 ${resources.wood} · 铁 ${resources.iron} · 铝 ${resources.aluminum}`;
}
function toggleBuildMenu(force) {
  if (P.flying || P.vehicle || P.turret || P.armorActive) return;
  buildOpen = force === undefined ? !buildOpen : force;
  buildMenuEl.style.display = buildOpen ? "flex" : "none";
  if (buildOpen) { document.exitPointerLock?.(); refreshBuildBalance(); }
}
function buildPlacement() {
  const f = dirVec(P.yaw, 0), dist = 5;
  return { x: Math.round((P.x + f.x * dist) * 2) / 2, z: Math.round((P.z + f.z * dist) * 2) / 2, y: groundAt(P.x + f.x * dist, P.z + f.z * dist, P.y) };
}
function addBuildCollider(x,z,hx,hz,height) {
  const box = { x0:x-hx, x1:x+hx, y0:0, y1:height, z0:z-hz, z1:z+hz };
  walls.push(box); builtColliders.push(box);
}
function buildAt(name) {
  const cost = buildCosts[name];
  if (!cost) return;
  if (!hasBuildMaterials(cost)) { buildBalanceEl.textContent = `材料不足。拥有：木 ${resources.wood} · 铁 ${resources.iron} · 铝 ${resources.aluminum}`; return; }
  const pos = buildPlacement();

// 城市：一排排的高楼，之间留出街道，可以自由探索
function buildCity() {
  const xs = [-112, -84, -56, -28, 28, 56, 84, 112];
  for (const bx of xs) {
    for (const bz of xs) {
      if (Math.abs(bx) < 40 && Math.abs(bz) < 40) continue;
      const w = 12 + Math.random() * 4, d = 12 + Math.random() * 4, h = 12 + Math.random() * 18;
      const x0 = bx - w / 2, z0 = bz - d / 2;
      // Knocked-out wall sections leave visible breaches while retaining nearby rubble.
      const front = Math.random() < 0.5;
      if (front) {
        const gap = Math.min(4.5, w * 0.34), mid = x0 + w * (0.35 + Math.random() * 0.3);
        addBox(x0, mid-gap/2, 0, h, z0, z0+d, "wall");
        addBox(mid+gap/2, x0+w, 0, h, z0, z0+d, "wall");
      } else {
        const gap = Math.min(4.5, d * 0.34), mid = z0 + d * (0.35 + Math.random() * 0.3);
        addBox(x0, x0+w, 0, h, z0, mid-gap/2, "wall");
        addBox(x0, x0+w, 0, h, mid+gap/2, z0+d, "wall");
      }
      cityRects.push({ x0, x1: x0 + w, z0, z1: z0 + d });
    }
  }
}

// 坦克碰撞：用 3.2 x 4.8 的范围检查墙、树和车
function tankBlocked(x, z) {
  for (const w of walls) {
    if (x + 1.6 > w.x0 && x - 1.6 < w.x1 && z + 2.4 > w.z0 && z - 2.4 < w.z1) return true;
  }
  return false;
}

function driveTank(dt) {
  const t = tank;
  if (keys.KeyA) { t.yaw += 1.6 * dt; P.yaw += 1.6 * dt; }
  if (keys.KeyD) { t.yaw -= 1.6 * dt; P.yaw -= 1.6 * dt; }
  let v = 0;
  if (keys.KeyW) v = 6;
  if (keys.KeyS) v = -3;
  tank.trackSpin = (tank.trackSpin || 0) + v * dt;
  const fx = -Math.sin(t.yaw), fz = -Math.cos(t.yaw);
  const nx = t.x + fx * v * dt, nz = t.z + fz * v * dt;
  if (!tankBlocked(nx, t.z)) t.x = nx;
  if (!tankBlocked(t.x, nz)) t.z = nz;
  // 坦克会压扁路上的僵尸
  for (const zb of zombies) {
    if (!zb.dead && Math.hypot(zb.x - t.x, zb.z - t.z) < 2) hurtZombie(zb, 3);
  }
  t.y = groundAt(t.x, t.z, t.y);
  t.mesh.position.set(t.x, t.y, t.z);
  t.mesh.rotation.y = t.yaw;
  P.x = t.x; P.z = t.z; P.y = t.y;
}

function nearTank() {
  return P.y < 1 && Math.hypot(tank.x - P.x, tank.z - P.z) < 4.5;
}

function interactVehicle() {
  if (P.armorActive || P.turret) return;
  if (P.flying) { exitPlane(); return; }
  if (P.vehicle === tank) {
    P.vehicle = null; engineStop(); P.x = tank.x + 3; P.z = tank.z; P.y = groundAt(P.x, P.z, 0); return;
  }
  if (nearPlane()) { enterPlane(); return; }
  if (nearTank()) { P.vehicle = tank; initSound(); engineStart("tank"); P.yaw = tank.yaw; P.pitch = 0; return; }
}

// G 键：离开动力甲或操作炮台；载具统一使用 E 键
function toggleVehicleOrTurret() {
  if (P.armorActive) {
    P.armorActive=false; P.armor=false; P.x=P.armorX+1.6; P.z=P.armorZ; P.y=groundAt(P.x,P.z,0); return;
  }
  if (P.flying || P.vehicle) return;
  toggleTurret();
}

const zombies = [];
const projectiles = [];
const effects = [];
function spawnZombie() {
  for (let tries = 0; tries < 10; tries++) {
    const ang = Math.random() * Math.PI * 2, r = 20 + Math.random() * 14;
    const x = Math.max(-70, Math.min(70, P.x + Math.cos(ang) * r));
    const z = Math.max(-70, Math.min(70, P.z + Math.sin(ang) * r));
    if (inBuilding(x, z) || inCity(x, z)) continue;
    const g = new THREE.Group();
    const skin = new THREE.MeshLambertMaterial({ color: 0x6a9f5a });
    const cloth = new THREE.MeshLambertMaterial({ color: 0x2e4a2e });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), cloth); body.position.y = 1.0; g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), skin); head.position.y = 1.8; g.add(head);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
    for (const sx of [-0.13, 0.13]) {
      const e = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.05), eyeMat);
      e.position.set(sx, 1.85, 0.28); g.add(e);
    }
    for (const sx of [-0.2, 0.2]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.22), cloth);
      leg.position.set(sx, 0.4, 0); g.add(leg);
    }
    for (const sx of [-0.5, 0.5]) {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), skin);
      arm.position.set(sx, 1.25, 0.25); arm.rotation.x = -0.9; g.add(arm);
    }
    scene.add(g);
    zombies.push({ x, z, y: groundAt(x, z, 0), hp: 2, cool: 0, dead: false, mesh: g, phase: Math.random() * 6 });
    return;
  }
}
function hurtZombie(z, amt) {
  if (z.dead) return;
  z.hp -= amt;
  if (z.hp <= 0) {
    z.dead = true;
    scene.remove(z.mesh);
    P.kills++;
    P.score += 100;
  }
}
function updateZombies(dt) {
  for (const z of zombies) {
    if (z.dead) continue;
    const dx = P.x - z.x, dz = P.z - z.z, d = Math.hypot(dx, dz);
    if (d > 1.2) {
      const sp = 2.2 * dt;
      const nx = z.x + dx / d * sp, nz = z.z + dz / d * sp;
      if (!hitsWall(nx, z.z, z.y)) z.x = nx;
      if (!hitsWall(z.x, nz, z.y)) z.z = nz;
    }
    z.y = groundAt(z.x, z.z, z.y + 0.5);
    z.cool -= dt;
    if (d < 1.6 && Math.abs(P.y - z.y) < 2.5 && z.cool <= 0) {
      z.cool = 1;
      damage(10);
    }
    z.mesh.position.set(z.x, z.y + Math.abs(Math.sin(time * 6 + z.phase)) * 0.08, z.z);
    z.mesh.rotation.y = Math.atan2(dx, dz);
  }
  for (let i = zombies.length - 1; i >= 0; i--) if (zombies[i].dead) zombies.splice(i, 1);
}

// ================= 伤害与效果 =================
function damage(amount) {
  if (over) return;
  P.hp -= amount;
  P.hurt = 0.25;
  P.regenWait = 4;
  if (P.hp <= 0) {
    P.hp = 0;
    if (P.respawns > 0) respawnPlayer();
    else endGame();
  }
}

function respawnPlayer() {
  P.respawns--;
  engineStop();
  P.x = 0; P.y = groundAt(0, 12, 0); P.z = 12; P.vy = 0;
  P.hp = 100; P.regenWait = 0; P.hurt = 0; P.flash = 0;
  P.vehicle = null; P.turret = null; P.flying = false; P.tankFP = false;
  P.armorActive = false; P.armor = false; P.tankMG = false;
  resetTank(); resetPlane(); showGun();
}

function dirVec(yaw, pitch) {
  return {
    x: -Math.sin(yaw) * Math.cos(pitch),
    y: Math.sin(pitch),
    z: -Math.cos(yaw) * Math.cos(pitch),
  };
}
function eyePos() {
  if (P.turret) return { x: P.x, y: P.y + 1.4, z: P.z };
  return { x: P.x, y: P.y + 1.65, z: P.z };
}

function tracer(a, b) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(a.x, a.y, a.z), new THREE.Vector3(b.x, b.y, b.z)]);
  const m = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xfff2a1, transparent:true, opacity:0.98, blending:THREE.AdditiveBlending }));
  scene.add(m);
  effects.push({ mesh: m, life: 0.13, maxLife:0.13, baseOpacity:0.98 });
  const hot = new THREE.Line(g.clone(), new THREE.LineBasicMaterial({ color:0xff7428, transparent:true, opacity:0.72, blending:THREE.AdditiveBlending }));
  scene.add(hot); effects.push({ mesh:hot, life:0.09, maxLife:0.09, baseOpacity:0.72 });
}

function muzzleSpark(o,d,color=0xffa33a,length=8) {
  const start={x:o.x+d.x*.65,y:o.y+d.y*.65,z:o.z+d.z*.65};
  const end={x:o.x+d.x*length,y:o.y+d.y*length,z:o.z+d.z*length};
  const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(start.x,start.y,start.z),new THREE.Vector3(end.x,end.y,end.z)]);
  const beam=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));
  scene.add(beam); effects.push({mesh:beam,life:.11,maxLife:.11,baseOpacity:.95});
  const flash=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));
  flash.position.set(start.x,start.y,start.z); scene.add(flash); effects.push({mesh:flash,life:.08,maxLife:.08,baseOpacity:.95,grow:true});
}

// 子弹：找出最近的墙和僵尸
function shootRay(o, d, dmg) {
  let wallT = Infinity;
  for (const w of walls) {
    const t = rayBox(o, d, w);
    if (t < wallT) wallT = t;
  }
  let hitZ = null, hitT = wallT;
  for (const z of zombies) {
    if (z.dead) continue;
    const vx = z.x - o.x, vy = z.y + 1 - o.y, vz = z.z - o.z;
    const t = vx * d.x + vy * d.y + vz * d.z;
    if (t < 0 || t > hitT) continue;
    const px = vx - d.x * t, py = vy - d.y * t, pz = vz - d.z * t;
    if (px * px + py * py + pz * pz < 0.35 * 0.35 * 1.2) { hitZ = z; hitT = t; }
  }
  if (hitZ) hurtZombie(hitZ, dmg);
  const len = Math.min(hitT, 60);
  tracer(o, { x: o.x + d.x * len, y: o.y + d.y * len, z: o.z + d.z * len });
  muzzleSpark(o,d,0xffaa42,Math.min(10,len));
}

function launchRocket(o, d, options={}) {
  let m;
  if (options.homing) {
    m = new THREE.Group();
    const shell = new THREE.MeshStandardMaterial({ color:0xc2c7c3, metalness:0.78, roughness:0.34 });
    const dark = new THREE.MeshStandardMaterial({ color:0x374044, metalness:0.65, roughness:0.42 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.9,10),shell); body.rotation.x=Math.PI/2; m.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.13,0.32,10),dark); nose.rotation.x=-Math.PI/2; nose.position.z=-0.58; m.add(nose);
    for(const side of [-1,1]){const fin=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.24,0.28),dark);fin.position.set(side*0.16,0,0.3);m.add(fin);}
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.38,8),new THREE.MeshBasicMaterial({color:0xff7a24})); flame.rotation.x=Math.PI/2; flame.position.z=0.62; m.add(flame);
  } else {
    m = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff9800 }));
  }
  scene.add(m);
  const speed = options.homing ? 38 : 30;
  muzzleSpark(o,d,options.homing?0xffb34e:0xff7730,7);
  projectiles.push({ x: o.x + d.x * 0.55, y: o.y + d.y * 0.55, z: o.z + d.z * 0.55,
    vx: d.x * speed, vy: d.y * speed, vz: d.z * speed, speed, homing:!!options.homing, life:options.homing?5:2, dead:false, mesh:m });
}

function explode(x, y, z) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0xff9800, transparent: true, opacity: 0.8 }));
  m.position.set(x, y, z);
  scene.add(m);
  effects.push({ mesh: m, life: 0.35, grow: true });
  damageDestructibles(x, y, z, 3.5, 2);
  for (const zb of zombies) {
    if (zb.dead) continue;
    const d = Math.hypot(zb.x - x, zb.y + 1 - y, zb.z - z);
    if (d < 3.5) hurtZombie(zb, d < 1.8 ? 2 : 1);
  }
  // 火箭跳：爆炸离玩家近，就把玩家炸起来
  const pd = Math.hypot(P.x - x, P.y + 0.9 - y, P.z - z);
  if (pd < 3.2 && !P.turret) {
    const pw = 1 - pd / 3.2;
    P.vy = Math.max(P.vy, 9 * pw);
    const nx = pd > 0.01 ? (P.x - x) / pd : 0, nz = pd > 0.01 ? (P.z - z) / pd : 0;
    if (!hitsWall(P.x + nx * pw, P.z, P.y)) P.x += nx * pw;
    if (!hitsWall(P.x, P.z + nz * pw, P.y)) P.z += nz * pw;
    damage(14 * pw);
  }
}

function updateProjectiles(dt) {
  for (const r of projectiles) {
    if (r.dead) continue;
    r.life -= dt;
    if (r.homing) {
      let target = r.target && !r.target.dead ? r.target : null;
      if (!target) {
        let nearest = Infinity;
        for (const z of zombies) if (!z.dead) {
          const d = Math.hypot(z.x-r.x,z.y+1-r.y,z.z-r.z);
          if (d < nearest) { nearest=d; target=z; }
        }
        r.target = target;
      }
      if (target) {
        const desired = new THREE.Vector3(target.x-r.x,target.y+1-r.y,target.z-r.z).normalize();
        const current = new THREE.Vector3(r.vx,r.vy,r.vz).normalize().lerp(desired,Math.min(1,dt*3)).normalize();
        r.vx=current.x*r.speed; r.vy=current.y*r.speed; r.vz=current.z*r.speed;
      }
    }
    r.x += r.vx * dt; r.y += r.vy * dt; r.z += r.vz * dt;
    if (!r.homing) r.vy -= 4 * dt;
    r.mesh.position.set(r.x, r.y, r.z);
    if (r.homing) r.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),new THREE.Vector3(r.vx,r.vy,r.vz).normalize());
    let hit = r.life <= 0 || r.y < groundAt(r.x, r.z, r.y) + 0.1 || inWallPoint(r.x, r.y, r.z);
    for (const zb of zombies) {
      if (!zb.dead && Math.hypot(zb.x - r.x, zb.y + 1 - r.y, zb.z - r.z) < 0.9) hit = true;
    }
    if (hit) {
      explode(r.x, r.y, r.z);
      scene.remove(r.mesh);
      r.dead = true;
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--) if (projectiles[i].dead) projectiles.splice(i, 1);
}

function updateEffects(dt) {
  for (const e of effects) {
    e.life -= dt;
    if (e.maxLife && e.mesh.material && e.mesh.material.transparent) e.mesh.material.opacity=e.baseOpacity*Math.max(0,e.life/e.maxLife);
    if (e.grow) {
      const s = 1 + (0.35 - e.life) * 8;
      e.mesh.scale.set(s, s, s);
    }
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    if (effects[i].life <= 0) {
      const mesh=effects[i].mesh; scene.remove(mesh);
      if(mesh.geometry) mesh.geometry.dispose();
      if(Array.isArray(mesh.material)) mesh.material.forEach(m=>m.dispose());
      else if(mesh.material) mesh.material.dispose();
      effects.splice(i, 1);
    }
  }
}

// ================= 开火 =================
function fireWeapon() {
  if (P.reload > 0) return;
  const o = eyePos();
  const d = dirVec(P.yaw, P.pitch);
  if (P.vehicle) {
    if (P.fireCd > 0) return;
    if(P.tankMG){ P.fireCd=.09; shootRay(o,d,1); sfxMachineGun(); return; }
    P.fireCd = 1.5;
    P.kick = 1;
    launchRocket({ x: tank.x + d.x * 3, y: tank.y + 2 + d.y * 3, z: tank.z + d.z * 3 }, d);
    sfxCannon();
    return;
  }
  if (P.turret) {
    if (P.fireCd > 0) return;
    const mz = turretMuzzle(P.turret);
    muzzleFlash(mz);
    if (P.turret.type === "C") { P.fireCd = 1.2; launchRocket(mz, d); sfxCannon(); }
    else { P.fireCd = 0.12; shootRay(mz, d, 1); if (P.turret.soundCd <= 0) { sfxMachineGun(); P.turret.soundCd = 0.12; } }
    P.flash = 0.05;
    return;
  }
  if (P.weapon === 0) {
    if (P.fireCd > 0 || P.clip <= 0) return;
    P.fireCd = 0.14;
    P.clip--;
    P.kick = 1;
    P.flash = 0.05;
    shootRay(o, d, 1);
    sfxRifle();
  } else if (P.weapon === 1) {
    if (P.fireCd > 0) return;
    P.fireCd = 0.9;
    P.kick = 1;
    launchRocket(o, d);
    sfxBoom();
  } else if ([6,9,7,8].includes(P.weapon)) {
    if (P.fireCd>0 || P.clip<=0) return; P.clip--; P.fireCd=P.weapon===6||P.weapon===9?0.1:0.42;
    shootRay(o,d,P.weapon===6?1.2:1); sfxRifle();
  } else if (P.weapon===12) {
    if(P.fireCd>0||P.clip<=0)return; P.clip--; P.fireCd=0.16; launchRocket(o,d); sfxCannon();
  } else if (P.weapon===13) {
    if(P.fireCd>0||P.clip<=0)return; P.clip--; P.fireCd=0.7;
    blueMuzzle(o,d); launchRocket(o,d); sfxBoom();
  } else if (P.weapon===11) {
    if(P.fireCd>0)return; P.fireCd=0.8; launchRocket(o,d); sfxBoom();
  } else if ([4,5,10,14,15].includes(P.weapon)) {
    if(P.fireCd>0)return; P.fireCd=P.weapon===5?0.5:0.65; sfxSaw();
    P.kick=0.8;
    muzzleSpark(o,d,P.weapon===4||P.weapon===15?0xd8f4ff:0xffbd52,3.5);
    const reach=P.weapon===10?3.0:P.weapon===14?2.45:P.weapon===15?2.3:1.8;
    for(const z of zombies){const dx=z.x-P.x,dz=z.z-P.z,dist=Math.hypot(dx,dz); if(!z.dead&&dist<reach&&dist>0&&(dx*d.x+dz*d.z)/dist>0.55)hurtZombie(z,P.weapon===10||P.weapon===14||P.weapon===15?2:1);}
  }
}

function blueMuzzle(o,d){
  const p={x:o.x+d.x*1.1,y:o.y+d.y*1.1,z:o.z+d.z*1.1};
  muzzleSpark(o,d,0x31cfff,11);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),new THREE.MeshBasicMaterial({color:0x31cfff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending})); glow.position.set(p.x,p.y,p.z); scene.add(glow); effects.push({mesh:glow,life:.13,grow:true});
  const light=new THREE.PointLight(0x32cfff,3,8); light.position.set(p.x,p.y,p.z); scene.add(light); effects.push({mesh:light,life:.1});
}

function fireGatlingRocket(o,d) { launchRocket(o,d); }

// 电锯：按住左键时对前方近距离僵尸造成伤害，并加速移动
function updateSaw(dt) {
  if (P.turret || P.vehicle || P.weapon !== 2 || !mouseDown) return;
  P.sawCd -= dt;
  if (P.sawCd > 0) return;
  P.sawCd = 0.25;
  sfxSaw();
  P.kick=0.55;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  muzzleSpark(eyePos(),dirVec(P.yaw,P.pitch),0xffd458,3.2);
  for (const z of zombies) {
    if (z.dead) continue;
    const dx = z.x - P.x, dz = z.z - P.z, d = Math.hypot(dx, dz);
    if (d > 2.2 || d < 0.01) continue;
    if ((dx * fx + dz * fz) / d > 0.6) hurtZombie(z, 1);
  }
}

// ================= 玩家移动与重力 =================
function movePlayer(dt) {
  let f = 0, s = 0;
  if (keys.KeyW) f += 1;
  if (keys.KeyS) f -= 1;
  if (keys.KeyD) s += 1;
  if (keys.KeyA) s -= 1;
  const len = Math.hypot(f, s) || 1;
  f /= len; s /= len;
  const sawing = P.weapon === 2 && mouseDown;
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? 8 : sawing ? 6.5 : 5;
  const sp = speed * dt;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  const rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  const mx = (fx * f + rx * s) * sp, mz = (fz * f + rz * s) * sp;
  if (!hitsWall(P.x + mx, P.z, P.y)) P.x += mx;
  if (!hitsWall(P.x, P.z + mz, P.y)) P.z += mz;

  P.vy -= 22 * dt;
  P.y += P.vy * dt;
  const gy = groundAt(P.x, P.z, P.y);
  if (P.y <= gy && P.vy <= 0) {
    P.y = gy;
    P.vy = 0;
    P.onGround = true;
  } else {
    P.onGround = false;
  }
}

// 炮台操作：按 G 进入或离开
function toggleTurret() {
  if (P.turret) {
    P.turret = null;
    P.z += 1.5;
    P.y = groundAt(P.x, P.z, P.y);
    return;
  }
  for (const t of turrets) {
    if (Math.hypot(t.x - P.x, t.z - P.z) < 2.6 && Math.abs(t.y - P.y) < 1.5) {
      P.turret = t;
      P.x = t.x;
      P.z = t.z + 0.9;
      P.y = t.y;
      P.vy = 0;
      return;
    }
  }
}

function nearTurret() {
  for (const t of turrets) {
    if (Math.hypot(t.x - P.x, t.z - P.z) < 2.6 && Math.abs(t.y - P.y) < 1.5) return t;
  }
  return null;
}

// ================= 波次 =================
let waveWait = 0;
function startWave() {
  P.wave++;
  const n = 3 + P.wave * 2;
  for (let i = 0; i < n; i++) spawnZombie();
}

// ================= 更新 =================
function update(dt) {
  if (!running || over) return;
  if (lootNoticeTimer > 0) lootNoticeTimer=Math.max(0,lootNoticeTimer-dt);
  if (plane.destroyed) {
    plane.respawnTimer = Math.max(0, plane.respawnTimer - dt);
    if (plane.respawnTimer === 0) resetPlane();
  }
  P.fireCd = Math.max(0, P.fireCd - dt);
  if (P.flash > 0) P.flash -= dt;
  if (P.hurt > 0) P.hurt -= dt;
  if (P.kick > 0) P.kick = Math.max(0, P.kick - dt * 8);

  if (P.regenWait > 0) P.regenWait -= dt;
  else if (P.hp < 100) P.hp = Math.min(100, P.hp + 6 * dt);

  if (P.turret) {
    P.y = P.turret.y;
  } else if (P.vehicle) {
    driveTank(dt);
  } else if (P.flying) {
    planeFly(dt);
  } else if(P.armorActive) {
    const speed=keys.ShiftLeft?8:5.5, f=-Math.cos(P.armorYaw), r=Math.sin(P.armorYaw);
    const vx=(-Math.sin(P.armorYaw)*(keys.KeyW?1:0)+Math.sin(P.armorYaw)*(keys.KeyS?1:0)+Math.cos(P.armorYaw)*(keys.KeyD?1:0)-Math.cos(P.armorYaw)*(keys.KeyA?1:0))*speed*dt;
    const vz=(f*(keys.KeyW?1:0)-f*(keys.KeyS?1:0)-r*(keys.KeyD?1:0)+r*(keys.KeyA?1:0))*speed*dt;
    P.armorX+=vx;P.armorZ+=vz;P.x=P.armorX;P.z=P.armorZ;P.yaw=P.armorYaw;
    P.armorFireCd=Math.max(0,P.armorFireCd-dt);
    if(mouseDown&&P.armorFireCd<=0){P.armorFireCd=.7;const d=dirVec(P.yaw,P.pitch),o={x:P.x,y:P.y+1.6,z:P.z};blueMuzzle(o,d);fireGatlingRocket(o,d);sfxBoom();}
  } else {
    movePlayer(dt);
  }

  if (!P.vehicle && !P.flying && !P.turret && !P.armorActive) collectLoot(false);

  updateSaw(dt);
  updateFlame(dt);
  updateTurrets(dt);
  if (P.vehicle) engineUpdate(keys.KeyW || keys.KeyS ? 0.8 : 0.2);
  else if (P.flying) engineUpdate(plane.speed / 60);
  if (plane.mesh) plane.mesh.visible = !P.flying || !plane.fp;
  if(P.reload>0) {
    P.reload=Math.max(0,P.reload-dt);
    if(P.reload===0) P.clip=P.ammoMax;
  }
  if (mouseDown && !P.flying && (P.weapon !== 2 || P.turret || P.vehicle) && !loadoutOpen && !buildOpen) fireWeapon();

  updateZombies(dt);
  updateProjectiles(dt);
  updateEffects(dt);

  if (zombies.length === 0) {
    waveWait += dt;
    if (waveWait > 2.5) { waveWait = 0; startWave(); }
  }

  // 手持武器的后坐力和走路晃动
  const moving = keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD;
  const bob = moving && !P.turret ? Math.sin(time * 9) * 0.012 : 0;
  const reloadProgress=P.reload>0?1-P.reload/P.reloadDuration:0;
  const reloadDip=P.reload>0?Math.sin(reloadProgress*Math.PI):0;
  gunRoot.position.set(0.28, -0.26 + bob - reloadDip*0.2, -0.55 + P.kick * 0.08);
  gunRoot.rotation.set(P.kick*0.15+reloadDip*0.38,0,P.reload>0?Math.sin(reloadProgress*Math.PI*2)*0.16:0);
  reloadMag.visible=P.reload>0&&reloadProgress>0.2&&reloadProgress<0.82;
  reloadMag.position.set(0,-0.34-Math.sin(Math.PI*Math.max(0,Math.min(1,(reloadProgress-0.2)/0.62)))*0.55,0.02);
  gunRoot.visible = !P.vehicle && !P.turret && !P.flying && !P.armor && !loadoutOpen;
  for(const unit of armorUnits){unit.mesh.visible=true;}
  if(P.armorActive && P.armorUnit){P.armorUnit.x=P.armorX;P.armorUnit.z=P.armorZ;P.armorUnit.yaw=P.armorYaw;P.armorUnit.mesh.position.set(P.armorX,P.y,P.armorZ);P.armorUnit.mesh.rotation.y=P.armorYaw;}
}

function updateCamera() {
  if(P.armorActive){const fw=dirVec(P.armorYaw,0);camera.position.set(P.armorX+fw.x*.25,P.y+2.65,P.armorZ+fw.z*.25);camera.rotation.set(P.pitch,P.armorYaw,0,"YXZ");return;}
  if (P.flying) {
    if (plane.fp) {
      const fwd = dirVec(P.yaw, 0);
      camera.position.set(plane.x + fwd.x * 0.65, plane.y + 1.15, plane.z + fwd.z * 0.65);
      camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
    } else {
      const back = dirVec(P.yaw, 0), look = dirVec(P.yaw, P.pitch);
      camera.position.set(plane.x - back.x * 9, plane.y + 4.2, plane.z - back.z * 9);
      camera.lookAt(plane.x + look.x * 8, plane.y + 1 + look.y * 8, plane.z + look.z * 8);
    }
    return;
  }
  if (P.vehicle) {
    const t = P.vehicle;
    if (P.tankFP) {
      const local = new THREE.Vector3(0, 2.55, -0.35).applyAxisAngle(new THREE.Vector3(0,1,0), t.yaw);
      camera.position.set(t.x + local.x, t.y + local.y, t.z + local.z);
      const sight = t.fpCabin && t.fpCabin.children[1];
      if (sight) sight.visible = false;
      if (t.fpCabin) t.fpCabin.visible = true;
    } else {
      camera.position.set(t.x + Math.sin(P.yaw) * 7, t.y + 3.6, t.z + Math.cos(P.yaw) * 7);
      if (t.fpCabin) {
        t.fpCabin.visible = true;
        const sight = t.fpCabin.children[1]; if (sight) sight.visible = true;
      }
    }
    camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
    return;
  }
  if (P.turret) {
    camera.position.set(P.x, P.y + 1.4, P.z);
  } else {
    camera.position.set(P.x, P.y + 1.65, P.z);
  }
  camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
}

function updateHUD() {
  const fl = P.y < 3.5 ? "一楼" : P.y < 7.5 ? "二楼" : "天台";
  const near = !P.turret && nearTurret();
  const weapon = P.flying ? "战斗机" : P.vehicle ? "坦克" : P.turret ? (P.turret.type === "C" ? "大炮" : "机枪") : WEAPON_NAMES[P.weapon];
  const lootNear = lootItems.some(a=>Math.hypot(a.x-P.x,a.z-P.z)<12 && Math.abs(P.y-a.y)<4.5);
  hudEl.innerHTML =
    `分数 ${P.score} ｜ 击杀 ${P.kills} ｜ 第 ${P.wave} 波 ｜ 剩余僵尸 ${zombies.length} ｜ 重生机会 ${P.respawns}<br>` +
    `位置：${fl}` +
    (near ? `<br>按 G 操作${near.type === "C" ? "大炮" : "机枪"}` : "") +
    (P.turret ? `<br>操作中，按 G 离开` : "") +
    (P.vehicle ? `<br>驾驶坦克：W/S 前进后退，A/D 转车身，鼠标瞄准，左键开炮，E 下车` : "") +
    (!P.vehicle && !P.turret && nearTank() ? `<br>按 E 驾驶坦克` : "") +
    (P.vehicle ? `<br>坦克按 2 切换机枪模式，V 切换第一人称` : "") +
    (P.armorActive ? `<br>驾驶动力甲：WASD 移动，鼠标瞄准，左键星际炮（蓝焰），G 离开` : "") +
    (P.flying ? `<br>速度 ${Math.round(plane.speed * 4)} ｜ 高度 ${Math.round(plane.y)}<br>空格可原地起飞/上升，左 Ctrl 下降；W/S 加减速，鼠标操纵机头，左键机炮，Q 机腹追踪导弹，B 投弹，V 切换机舱视角，E 离机` : "") +
    (!P.flying && !P.vehicle && !P.turret && nearPlane() ? `<br>按 E 登上战斗机` : "") +
    (plane.destroyed ? `<br>战机已坠毁，${Math.ceil(plane.respawnTimer)} 秒后重新生成` : "");
  if (!P.flying && !P.vehicle && !P.turret && lootNear) hudEl.innerHTML += `<br>靠近自动拾取，或按 E 搜刮附近材料`;
  if (lootNoticeTimer > 0) hudEl.innerHTML += `<br><strong style="color:#b9e48c">拾取：${lootNotice}</strong>`;
  if (!P.flying && !P.vehicle && !P.turret) hudEl.innerHTML += `<br>坦克位置约 (-16, 10)｜战机在公寓外侧空地 (10, -10)`;
  bhudEl.innerHTML =
    `<span>血量 ${Math.round(P.hp)}</span> ｜ <span>${weapon}</span> ｜ 弹药 ∞` +
    `<br><span>材料：木 ${resources.wood} ｜ 铁 ${resources.iron} ｜ 铝 ${resources.aluminum} ｜ 医疗包 ${P.medkits}（H 使用）</span>` +
    (P.reload>0 ? `<br><span style="color:#ffd166">换弹中…</span>` : "") +
    `<br><span style="opacity:.8">1 步枪 ｜ 2 火箭筒／坦克机枪 ｜ 3 电锯 ｜ 4 喷火枪 ｜ 空格跳跃 ｜ G 炮台 ｜ B 建造基地</span>`;
  flashEl.style.opacity = P.hurt > 0 ? 1 : 0;
}

// ================= 开始、暂停、结束 =================
function resetGame() {
  for (const z of zombies) scene.remove(z.mesh);
  zombies.length = 0;
  for (const r of projectiles) scene.remove(r.mesh);
  projectiles.length = 0;
  for (const e of effects) scene.remove(e.mesh);
  effects.length = 0;
  Object.assign(P, { x: 0, y: 0, z: 12, vy: 0, yaw: 0, pitch: 0, hp: 100, kills: 0, score: 0, medkits: 1, respawns: 1, tankMG: false, armorActive:false,
    weapon: 0, regenWait: 0, reload:0, clip:30, turret: null, vehicle: null, flying: false, tankFP: false, fireCd: 0, sawCd: 0, flash: 0, hurt: 0, kick: 0, wave: 0 });
  over = false;
  waveWait = 0;
  showGun();
  resetTank();
  resetPlane();
  startWave();
}

function begin() {
  resetGame();
  running = true;
  overlay.style.display = "none";
}

function endGame() {
  over = true;
  mouseDown = false;
  document.exitPointerLock();
  titleEl.textContent = "游戏结束";
  descEl.innerHTML = `得分 ${P.score}，击杀 ${P.kills} 只僵尸，坚持到第 ${P.wave} 波`;
  startBtn.textContent = "再来一次";
  overlay.style.display = "flex";
}

startBtn.addEventListener("click", () => {
  initSound();
  if (!running || over) begin();
  overlay.style.display = "none";
  renderer.domElement.requestPointerLock();
});

renderer.domElement.addEventListener("click", () => {
  if (running && !over && !locked) renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!locked && running && !over) {
    mouseDown = false;
    titleEl.textContent = "暂停";
    descEl.textContent = "按下面的按钮继续";
    startBtn.textContent = "继续";
    overlay.style.display = "flex";
  }
});

document.addEventListener("mousemove", e => {
  if (!running || over) return;
  let dx = 0, dy = 0;
  if (locked) {
    dx = e.movementX;
    dy = e.movementY;
  } else if (rightDown) {
    dx = e.clientX - lastMX;
    dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
  } else {
    return;
  }
  P.yaw -= dx * 0.0022;
  P.pitch -= dy * 0.0022;
  P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch));
});

renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());
renderer.domElement.addEventListener("mousedown", e => {
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) { rightDown = true; lastMX = e.clientX; lastMY = e.clientY; }
});
addEventListener("mouseup", e => {
  if (e.button === 0) mouseDown = false;
  if (e.button === 2) rightDown = false;
});

addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (running && !over && !P.turret && !P.vehicle && !P.flying && P.onGround) P.vy = 8.5;
  } else if (e.code === "Digit1") { P.weapon = 0; showGun(); }
  else if (e.code === "Digit2") { if (P.vehicle) P.tankMG = !P.tankMG; else { P.weapon = 1; showGun(); } }
  else if (e.code === "Digit3") { P.weapon = 2; showGun(); }
  else if (e.code === "Digit4") { P.weapon = 3; showGun(); }
  else if (e.code === "KeyG" && running && !over) { toggleVehicleOrTurret(); }
  else if (e.code === "KeyE" && !e.repeat && running && !over) {
    if (!P.flying && !P.vehicle && !P.turret && !P.armorActive && collectLoot(true)) { /* picked up the closest nearby drop */ }
    else if (P.flying || P.vehicle || nearPlane() || nearTank()) interactVehicle();
  }
  else if (e.code === "KeyH" && running && !over) { useMedkit(); }
  else if (e.code === "KeyQ" && running && !over && P.flying) { planeMissile(); }
  else if (e.code === "KeyB" && !e.repeat && running && !over) { if (P.flying) planeBomb(); else toggleBuildMenu(); }
  else if (e.code === "Escape" && buildOpen) { toggleBuildMenu(false); }
  else if (e.code === "KeyV" && running && !over && P.vehicle) { P.tankFP = !P.tankFP; }
  else if (e.code === "KeyV" && running && !over && P.flying) { plane.fp = !plane.fp; }
  else if (e.code === "KeyF") { toggleLoadout(); }
  else if (e.code === "KeyR" && !e.repeat && running && !over && P.reload<=0) { P.reload=P.reloadDuration; sfxShot(); }
});
addEventListener("keyup", e => {
  keys[e.code] = false;
});

function releaseAll() {
  for (const k in keys) keys[k] = false;
  mouseDown = false;
}
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

descEl.innerHTML =
  "WASD 移动，Shift 冲刺，空格跳跃<br>" +
  "射击：鼠标左键或 F 键（按住连射）｜ R 换弹（可见装填动作）｜ 转视角：移动鼠标，或按住右键拖动<br>" +
  "1 步枪，2 火箭筒，3 电锯，4 喷火枪；F 打开装备菜单，含蝴蝶刀和爪刀<br>" +
  "走上斜坡进公寓二楼，靠近炮台按 G 操作，僵尸会靠近咬你<br>" +
  "靠近材料箱按 E 搜刮木材、铁、铝和药品；按 B 打开建造菜单，在面前建造机枪炮台、铁门、铁墙或床。坦克停在城市西侧，战斗机停在公寓外侧空地，两种载具靠近后都按 E 驾驶/登机，再按 E 下车/离机。战机位置约 (10, -10)，黄色光柱标出位置。坦克：W/S 前后，A/D 转向，左键开炮，V 坦克舱视角。战机：空格可原地起飞/上升，左 Ctrl 下降；W/S 加减速，V 座舱视角，Q 从机腹释放追踪僵尸的导弹，B 投弹，左键机炮。";

// ================= 主循环 =================
let last = performance.now(), lastHudUpdate = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;
  update(dt);
  updateCamera();
  if (now - lastHudUpdate > 120) { updateHUD(); lastHudUpdate = now; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
